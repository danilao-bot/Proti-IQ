# Jobs configuration for Proti IQ
# Comprehensive functional application models spanning alternative proteins and traditional applications.

jobs:
  egg:
    id: "egg"
    name: "Plant-Based Egg Gel"
    target_function: "Thermal gelation and heat-set coagulation resembling scrambled or set egg"
    primary_benchmark: "mung_bean"
    secondary_benchmark: "soy"
    key_family_target: "7S"  # Vicilin-like globulin
    weights:
      embedding_similarity: 0.35      # ESM-2 650M cosine similarity to benchmark vicilin
      family_match: 0.25              # 7S vicilin-like globulin alignment
      physicochemical_distance: 0.20  # Normalized Euclidean distance (MW, pI, GRAVY, Instability)
      sequence_identity: 0.15         # Pairwise BLOSUM62 alignment identity
      cysteine_fraction: 0.05         # Moderate requirement for heat cross-linking
    rationale: "Mung bean 8S vicilin drives heat gelation in commercial egg substitutes (Brishti 2017). Vicilin homology and structural representation dominate."
    citations:
      - "Brishti et al. 2017, Int. Food Res. J. 24(4)"
      - "Food Chemistry: X (Cowpea protein gelation literature)"

  gel:
    id: "gel"
    name: "Tofu-Type Coagulated Gel"
    target_function: "Salt- or acid-induced firm curd network formation"
    primary_benchmark: "soy"
    secondary_benchmark: "mung_bean"
    key_family_target: "11S" # Legumin-like globulin (glycinin)
    weights:
      embedding_similarity: 0.25
      family_match: 0.25              # 11S legumin-like share
      cysteine_fraction: 0.20         # Disulfide bridge formation crucial for 11S gel elasticity
      physicochemical_distance: 0.15
      sequence_identity: 0.15
    rationale: "Soy glycinin (11S) hexamers form intermolecular disulfide bonds during coagulant-induced gelation (Breeding Science 2000, Foods 2025)."
    citations:
      - "Foods 2025, 14(23):4029"
      - "Breeding Science 50(2), 2000"

  milk:
    id: "milk"
    name: "Plant-Based Milk Dispersion"
    target_function: "Colloidal stability, neutral-pH solubility, low sedimentation"
    primary_benchmark: "soy"
    secondary_benchmark: "pea"
    key_family_target: "7S"  # Beta-conglycinin drives plant milk colloidal stability
    weights:
      embedding_similarity: 0.25
      family_match: 0.15              # 7S vicilin-like globulins form stable colloidal dispersions
      solubility_proxy: 0.25          # Charge density + hydrophilicity + pI clearance from pH 7
      physicochemical_distance: 0.20
      sequence_identity: 0.15
    confidence_penalty: 1.00          # Pretoria open benchmark provides direct neutral-pH solubility measurements
    rationale: "Soy milk stability requires high solubility at pH 6.5-7.2; pea suffers from poor solubility (Tang et al. 2023)."
    citations:
      - "Tang, Roos and Miao 2023, Foods 12(2):368"

  meat:
    id: "meat"
    name: "Textured Plant-Based Meat & Suya"
    target_function: "High-temperature shear fiber formation and tensile chewiness"
    primary_benchmark: "soy"
    secondary_benchmark: "mung_bean"
    key_family_target: "11S" # Legumin-like globulin (glycinin)
    weights:
      embedding_similarity: 0.30
      family_match: 0.25
      cysteine_fraction: 0.25         # Essential for intermolecular covalent disulfide bonds during extrusion
      physicochemical_distance: 0.20
    rationale: "11S legumin hexamers unfold under high-moisture extrusion shear, forming covalent disulfide cross-links for meat-like fibrous texture."
    citations:
      - "Osen et al. 2014, Food Chemistry (High-moisture extrusion of plant proteins)"
      - "Foods 2025, 14(23):4029"

  crayfish:
    id: "crayfish"
    name: "Savory Umami Peptides & Crayfish Alternative"
    target_function: "Savory umami peptide yield and glutamate-dense hydrolysates"
    primary_benchmark: "soy"
    secondary_benchmark: "mung_bean"
    key_family_target: "7S"
    weights:
      embedding_similarity: 0.25
      family_match: 0.20
      solubility_proxy: 0.30          # High solubility for liquid and spray-dried seasoning broth
      physicochemical_distance: 0.25
    rationale: "Storage globulins with acidic amino acid clusters (Glu, Asp) release potent savory umami peptides upon solid-state fermentation."
    citations:
      - "Beaumont 2002, Int. J. Food Microbiol. (Fermented legume condiments)"
      - "Achi 2005, African Journal of Biotechnology (Dawadawa fermentation)"

  mayo:
    id: "mayo"
    name: "Plant-Based Mayonnaise & Emulsions"
    target_function: "High oil-in-water emulsion stability (70% oil phase) and droplet encapsulation"
    primary_benchmark: "soy"
    secondary_benchmark: "mung_bean"
    key_family_target: "7S"
    weights:
      embedding_similarity: 0.30
      family_match: 0.25
      solubility_proxy: 0.25
      physicochemical_distance: 0.20
    rationale: "7S vicilin globulins form amphiphilic interfacial films around oil droplets, preventing droplet coalescence."
    citations:
      - "McSweeney et al. 2021, Food Hydrocolloids (Plant-based mayonnaise stabilization)"

  sarcopenia:
    id: "sarcopenia"
    name: "Clinical Sarcopenia High-Protein Swallows & Porridges"
    target_function: "High solubility at low solution viscosity for elderly swallow fortification"
    primary_benchmark: "soy"
    secondary_benchmark: "mung_bean"
    key_family_target: "7S"
    weights:
      embedding_similarity: 0.25
      family_match: 0.20
      solubility_proxy: 0.35          # High solubility at pH 4-7 to prevent gritty swallow texture
      physicochemical_distance: 0.20
    rationale: "Enzymatic hydrolysate incorporates 18g protein per portion into traditional swallows (Amala/Tuwo) without paste viscosity increase."
    citations:
      - "Bauer et al. 2013, JAMDA (Evidence-based recommendations for protein intake in older people)"
