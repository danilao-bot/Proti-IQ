version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/proti_iq.db
      - APP_ENV=production
    volumes:
      - ./data:/app/data
      - ./model_artifacts:/app/model_artifacts
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run ui/Home.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:///./data/proti_iq.db
      - API_URL=http://api:8000
    volumes:
      - ./data:/app/data
      - ./model_artifacts:/app/model_artifacts
    depends_on:
      - api
    restart: unless-stopped
