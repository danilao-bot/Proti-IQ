# Ruff configuration for Proti IQ
target-version = "py311"
line-length = 120

exclude = [
    ".git",
    "__pycache__",
    "data",
    "model_artifacts",
    "docs",
    "build",
    "dist",
    "scripts",
    ".venv",
    "venv",
]

[lint]
# Select fatal syntax and undefined names errors only
select = ["E9", "F63", "F7", "F82"]
ignore = [
    "E501",  # line length
    "F401",  # unused import
    "F841",  # unused variable
    "W605",  # invalid escape sequence in docstrings/markdown
]
